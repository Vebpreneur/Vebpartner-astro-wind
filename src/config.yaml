site:
  name: Vebpartner
  site: 'https://vebpartner.se'
  base: '/'
  trailingSlash: false
  googleSiteVerificationId: null

metadata:
  title:
    default: Vebpartner
    template: '%s — Vebpartner'
  description: 'Discover practical business opportunities, technical building blocks, services, learning paths and useful tools.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Vebpartner
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 8
    post:
      isEnabled: false
      permalink: '/%slug%'
      robots:
        index: false
    list:
      isEnabled: false
      pathname: 'blog'
      robots:
        index: false
    category:
      isEnabled: false
      pathname: 'category'
      robots:
        index: false
    tag:
      isEnabled: false
      pathname: 'tag'
      robots:
        index: false
    isRelatedPostsEnabled: false
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'system'
